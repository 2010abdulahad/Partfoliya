  <text x="312" y="88" fill="#38bdf8" font-family="monospace" font-size="10">Postgres</text>
  <text x="312" y="102" fill="#e0f2fe" font-family="monospace" font-size="9">WAL Log</text>

  <!-- Console Log bottom -->
  <rect x="45" y="125" width="315" height="75" rx="6" fill="#050a10"/>
