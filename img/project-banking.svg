  <text x="55" y="178" fill="#4ade80" font-family="monospace" font-size="9">Ledger balanced: Verified 0.00 drift</text>
  <text x="55" y="192" fill="#94a3b8" font-family="monospace" font-size="9">Audit event dispatched to Kafka / EventBus</text>
