<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1912" />
      <stop offset="50%" stop-color="#0d2e1f" />
      <stop offset="100%" stop-color="#05140d" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba973" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with Border -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="url(#neonGrad)" stroke-width="5" />
  
  <!-- Subtle Matrix / Tech Pattern -->
  <g opacity="0.12" stroke="#00ff88" stroke-width="1.5">
    <line x1="50" y1="100" x2="350" y2="100" stroke-dasharray="5 5" />
    <line x1="50" y1="200" x2="350" y2="200" stroke-dasharray="5 5" />
    <line x1="50" y1="300" x2="350" y2="300" stroke-dasharray="5 5" />
    <line x1="120" y1="50" x2="120" y2="350" stroke-dasharray="5 5" />
    <line x1="280" y1="50" x2="280" y2="350" stroke-dasharray="5 5" />
  </g>

  <!-- Code Symbols floating -->
  <text x="60" y="140" fill="#00ff88" font-family="monospace" font-size="22" font-weight="bold" opacity="0.5">&lt;Java&gt;</text>
  <text x="290" y="140" fill="#00ff88" font-family="monospace" font-size="22" font-weight="bold" opacity="0.5">{ }</text>
  <text x="50" y="270" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold" opacity="0.4">OOP</text>
  <text x="295" y="270" fill="#10b981" font-family="monospace" font-size="20" font-weight="bold" opacity="0.4">API;</text>

  <!-- Developer Silhouette / Illustration -->
  <!-- Clothes / Hoodie -->
  <path d="M 100 375 C 100 290, 140 265, 200 265 C 260 265, 300 290, 300 375 Z" fill="url(#suitGrad)" />
  <!-- Hoodie Collar / Accent -->
  <path d="M 160 265 L 200 320 L 240 265 Z" fill="#00ff88" opacity="0.8" />
  <path d="M 175 265 L 200 305 L 225 265 Z" fill="#0f172a" />

  <!-- Neck -->
  <rect x="180" y="225" width="40" height="45" rx="5" fill="#fba973" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#faceGrad)" />

  <!-- Hair (modern stylish side-part) -->
  <path d="M 135 170 C 135 110, 170 100, 210 100 C 255 100, 270 125, 265 170 C 250 135, 230 125, 195 125 C 160 125, 145 145, 135 170 Z" fill="#1e1b18" />
  <path d="M 135 160 C 130 130, 160 105, 205 105 C 250 105, 265 130, 265 155 C 255 125, 230 115, 195 115 C 160 115, 140 135, 135 160 Z" fill="#111" />

  <!-- Stylish Modern Glasses (Tech Developer Style) -->
  <rect x="155" y="165" width="35" height="25" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#111827" stroke-width="4" />
  <rect x="210" y="165" width="35" height="25" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#111827" stroke-width="4" />
  <line x1="190" y1="175" x2="210" y2="175" stroke="#111827" stroke-width="4" />
  <line x1="140" y1="173" x2="155" y2="175" stroke="#111827" stroke-width="3" />
  <line x1="245" y1="175" x2="260" y2="173" stroke="#111827" stroke-width="3" />

  <!-- Eyes behind glasses -->
  <circle cx="172" cy="177" r="4" fill="#1f2937" />
  <circle cx="228" cy="177" r="4" fill="#1f2937" />
  <circle cx="174" cy="175" r="1.5" fill="#fff" />
  <circle cx="230" cy="175" r="1.5" fill="#fff" />

  <!-- Eyebrows -->
  <path d="M 155 155 Q 172 150 190 156" stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 210 156 Q 228 150 245 155" stroke="#1f2937" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Friendly Smile -->
  <path d="M 185 215 Q 200 228 215 215" stroke="#c2410c" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Laptop / Desk glow in front -->
  <ellipse cx="200" cy="385" rx="140" ry="25" fill="#00ff88" opacity="0.25" filter="url(#glow)" />
  <rect x="140" y="360" width="120" height="25" rx="6" fill="#334155" stroke="url(#neonGrad)" stroke-width="2" />
  <!-- Glowing logo on laptop -->
  <circle cx="200" cy="372" r="5" fill="#00ff88" filter="url(#glow)" />
</svg>